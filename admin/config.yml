backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Shto {{collection}} “{{slug}}”'
    update: 'Përditëso {{collection}} “{{slug}}”'
    delete: 'Fshi {{collection}} “{{slug}}”'
    uploadMedia: 'Ngarko fotografinë “{{path}}”'
    deleteMedia: 'Fshi fotografinë “{{path}}”'

site_url: https://klosuja.com
display_url: https://klosuja.com
publish_mode: simple

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: materials
    label: Materialet
    label_singular: Material
    description: Shtoni dhe ndryshoni mermerët dhe granitet. Shqipja dhe anglishtja ruhen së bashku.
    folder: content/materials
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{order}} · {{name}} · {{category}}'
    sortable_fields:
      - order
      - name
      - category
    view_filters:
      - label: Vetëm mermer
        field: category
        pattern: mermer
      - label: Vetëm granit
        field: category
        pattern: granit
      - label: Të fshehura
        field: active
        pattern: false
    editor:
      preview: false
    fields:
      - label: Shfaqe në website
        name: active
        widget: boolean
        default: true
        hint: Çaktivizoje për ta fshehur pa e fshirë.

      - label: Renditja
        name: order
        widget: number
        value_type: int
        min: 1
        default: 100
        hint: Numri më i vogël shfaqet më përpara.

      - label: Emri i materialit
        name: name
        widget: string
        hint: Për shembull Carrara White.

      - label: Kategoria
        name: category
        widget: select
        options:
          - label: Mermer
            value: mermer
          - label: Granit
            value: granit

      - label: Fotografia kryesore
        name: image
        widget: image
        required: true
        choose_url: false
        allow_multiple: false
        media_library:
          config:
            max_file_size: 10485760
        hint: Përdorni JPG, PNG ose WebP deri në 10 MB. Pasi të publikoni, prisni deploy-in e Netlify para se të rifreskoni panelin.

      - label: Përmbajtja në shqip
        name: sq
        widget: object
        collapsed: false
        fields:
          - label: Etiketa e shkurtër
            name: tag
            widget: string
            required: false
            hint: Për shembull Premium, Rezistent ose I brendshëm.

          - label: Përshkrimi i fotografisë
            name: image_alt
            widget: string
            required: false

          - label: Përshkrimi i shkurtër
            name: summary
            widget: text

          - label: Përshkrimi i plotë
            name: description
            widget: text

          - label: Titulli SEO
            name: seo_title
            widget: string
            required: false
            hint: Lëreni bosh për ta krijuar automatikisht nga emri dhe kategoria.

          - label: Përshkrimi SEO
            name: seo_description
            widget: text
            required: false
            hint: Përmbledhje e shkurtër për Google; rreth 140–160 shenja.

          - label: Karakteristikat
            name: specs
            widget: list
            required: false
            collapsed: true
            summary: '{{fields.label}}: {{fields.value}}'
            fields:
              - label: Titulli
                name: label
                widget: string
              - label: Vlera
                name: value
                widget: string

      - label: English content
        name: en
        widget: object
        collapsed: true
        fields:
          - label: Short tag
            name: tag
            widget: string
            required: false

          - label: Image description
            name: image_alt
            widget: string
            required: false

          - label: Short description
            name: summary
            widget: text

          - label: Full description
            name: description
            widget: text

          - label: SEO title
            name: seo_title
            widget: string
            required: false
            hint: Leave blank to create it automatically from the material name and category.

          - label: SEO description
            name: seo_description
            widget: text
            required: false
            hint: A concise Google summary; approximately 140–160 characters.

          - label: Specifications
            name: specs
            widget: list
            required: false
            collapsed: true
            summary: '{{fields.label}}: {{fields.value}}'
            fields:
              - label: Label
                name: label
                widget: string
              - label: Value
                name: value
                widget: string
